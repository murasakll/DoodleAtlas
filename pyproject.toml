[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chiko-bedrock-map"
version = "0.2.0"
description = "Local Bedrock map viewer and pixel-art cartography editor"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/murasakll/Bedrock-Real-Time-Map-Viwer"
Issues = "https://github.com/murasakll/Bedrock-Real-Time-Map-Viwer/issues"
Documentation = "https://github.com/murasakll/Bedrock-Real-Time-Map-Viwer/blob/main/docs/GUIA.md"

[project.scripts]
chiko = "chiko.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
chiko = ["web/*", "assets/**/*", "bedrock_pack/**/*", "bedrock_pack/*", "vendor/**/*"]

[tool.setuptools.exclude-package-data]
chiko = ["vendor/seed-generator/validation-*.json", "assets/chiko/*.svg", "assets/chiko/*.prompt.txt", "_local/**/*", "**/__pycache__/*"]
