[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doodleatlas"
version = "0.2.0"
description = "DoodleAtlas: a hand-drawn notebook and interactive map for Minecraft Bedrock"
license = {file = "LICENSE"}
authors = [{name = "murasakll"}]
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/murasakll/Bedrock-Real-Time-Map-Viwer"
Issues = "https://github.com/murasakll/Bedrock-Real-Time-Map-Viwer/issues"
Documentation = "https://github.com/murasakll/Bedrock-Real-Time-Map-Viwer/blob/main/docs/GUIA.md"

[project.scripts]
doodleatlas = "chiko.__main__:main"
chiko = "chiko.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
chiko = ["web/*", "assets/**/*", "bedrock_pack/**/*", "bedrock_pack/*", "vendor/**/*"]

[tool.setuptools.exclude-package-data]
chiko = ["vendor/seed-generator/validation-*.json", "assets/chiko/*.svg", "assets/chiko/*.prompt.txt", "_local/**/*", "**/__pycache__/*"]
